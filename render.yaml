services:
  - type: web
    name: satria-academy-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start:api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
